# Cloudflare Worker — envoi des demandes de réservation Taxi Saint Irénée
# Documentation : voir README.md à la racine du projet, section "Configuration email".

name = "taxi-saint-irenee-booking"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

# Variables NON secrètes (les secrets se définissent avec `npx wrangler secret put`).
[vars]
# Origines autorisées à envoyer des demandes, séparées par des virgules, sans slash final.
# Exemple : "https://www.taxi-saint-irenee.fr,https://votre-compte.github.io"
ALLOWED_ORIGINS = "https://cutstudio750.github.io"
# Adresse qui reçoit les demandes.
BOOKING_TO_EMAIL = "taxi.saintirenee@gmail.com"
# Expéditeur. Pour tester sans domaine : "Taxi Saint Irénée <onboarding@resend.dev>"
# (Resend n'autorise alors l'envoi QU'À l'adresse du compte Resend).
# En production : une adresse d'un domaine vérifié chez Resend.
BOOKING_FROM_EMAIL = "Taxi Saint Irénée <onboarding@resend.dev>"
# "true" pour envoyer un accusé de réception au client (domaine vérifié requis).
SEND_ACKNOWLEDGEMENT = "false"

# Limitation de débit facultative (recommandée) : 5 demandes par minute et par IP.
# Décommenter après avoir lu https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "1001"
# simple = { limit = 5, period = 60 }
